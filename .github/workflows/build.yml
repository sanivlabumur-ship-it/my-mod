name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Ограничиваем память для Gradle, чтобы сервер его не убивал
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unpack Project Files
      run: |
        unzip project.zip
        rm project.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload Finished Jar
      uses: actions/upload-artifact@v4
      with:
        name: my-compiled-mod
        path: build/libs/*.jar
